<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Jeopardy Host</title>
    <!-- Painted before any script runs, so a reload never shows a blank white page. -->
    <style>
      html,
      body {
        margin: 0;
        background: #02031f;
      }
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: radial-gradient(circle at top, #0a0e8a 0%, #02031f 60%, #000 100%);
        color: #ffcc00;
        font-family: Oswald, 'Arial Narrow', Impact, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .boot-title {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 4rem);
        text-shadow: 3px 4px 0 rgba(0, 0, 0, 0.8);
      }
      .boot-bar {
        width: 12rem;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #ffcc00;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(160%);
        }
      }
      .boot-note {
        margin: 0;
        font-size: 0.8rem;
        color: #b9c0f5;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <p class="boot-title">Jeopardy!</p>
        <div class="boot-bar"></div>
        <p class="boot-note">Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
